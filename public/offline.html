<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0b0d" />
    <title>Sigma · Offline</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #0a0b0d; color: #eef0f2; font-family: ui-sans-serif, system-ui, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 16px; text-align: center; box-sizing: border-box; }
      .dot { width: 56px; height: 56px; border-radius: 18px; background: #121418; border: 1px solid #262a31; display: grid; place-items: center; font-size: 28px; margin-bottom: 16px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: #8a909b; font-size: 15px; line-height: 1.45; max-width: 22rem; margin: 0 0 20px; }
      button { height: 48px; padding: 0 20px; border: 0; border-radius: 16px; background: #c8f560; color: #11140a; font-size: 15px; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <div class="dot">📡</div>
      <h1>Kein Internet</h1>
      <p>Diese Seite hast du auf diesem Handy noch nicht geöffnet. Seiten, die du schon besucht hast, funktionieren auch offline, und Einträge wie Wasser oder Favoriten werden gesendet, sobald du wieder Empfang hast.</p>
      <button onclick="location.reload()">Erneut versuchen</button>
    </main>
  </body>
</html>
